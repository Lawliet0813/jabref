Click\ the\ "Get\ fulltext"\ button\ (second\ button\ with\ a\ download\ icon)\ to\ let\ JabRef\ automatically\ search\ for\ and\ download\ the\ PDF\ using\ online\ fetchers.\ This\ works\ when\ your\ entry\ has\ proper\ metadata\ like\ DOI\ or\ title.=點擊“獲取全文”按鈕（第二個帶有下載圖標的按鈕），讓JabRef使用線上抓取器自動搜索並下載PDF。當您的條目具有正確的元資料（如DOI或標題）時，此功能有效。

# Step 14
Wait\ for\ fulltext\ search\ to\ complete=等待全文搜索完成
JabRef\ is\ now\ searching\ for\ the\ full\ text\ of\ this\ paper\ using\ various\ online\ sources.\ Please\ wait\ for\ the\ search\ to\ complete.=JabRef正在使用各種線上資源搜索此論文的全文。請等待搜索完成。

# Step 15
Click\ "Download\ from\ URL"\ to\ download\ from\ a\ web\ link=點擊“從URL下載”以通過網頁鏈接下載
Click\ the\ "Download\ from\ URL"\ button\ (third\ button\ with\ a\ download\ icon)\ to\ download\ a\ PDF\ directly\ from\ a\ web\ URL.\ JabRef\ will\ prompt\ you\ to\ enter\ the\ URL\ and\ then\ download\ the\ file\ automatically.=點擊“從URL下載”按鈕（第三個帶有下載圖標的按鈕）可直接從網頁URL下載PDF。JabRef將提示您輸入URL，然後自動下載文件。

# Step 16
Enter\ URL\ for\ download=輸入下載URL
Enter\ the\ URL\ of\ the\ PDF\ file\ you\ want\ to\ download.\ You\ can\ try\ this\ example\ URL\:\ %0=輸入您要下載的PDF文件的URL。您可以嘗試此示例URL：%0

# Step 17
Confirm\ URL\ download=確認URL下載
Click\ "OK"\ to\ start\ downloading\ the\ PDF\ from\ the\ entered\ URL.=點擊“確定”開始從輸入的URL下載PDF。

# Step 18
PDF\ file\ linked\ successfully=PDF文件鏈接成功
Congratulations.\ You\ have\ successfully\ linked\ a\ PDF\ file\ to\ a\ bibliography\ entry.\ This\ makes\ it\ easy\ to\ access\ your\ research\ documents\ directly\ from\ JabRef.\ You\ can\ repeat\ this\ process\ for\ all\ your\ entries.=恭喜！您已成功將PDF文件鏈接到參考文獻條目。這使得您可以直接從JabRef訪問您的研究文檔。您可以對所有條目重複此過程。
For\ detailed\ information\:\ [Adding\ PDFs](%0),\ [Managing\ files](%1),\ [Finding\ unlinked\ files](%2).=詳細資訊請參閱：[新增PDF](%0)、[管理文件](%1)、[查找未鏈接文件](%2)。

