Now\ we\ need\ to\ access\ the\ entry\ editor.\ Click\ on\ the\ "General"\ tab\ to\ view\ and\ edit\ the\ entry\ details.=現在我們需要訪問條目編輯器。點擊"常規"標籤頁以查看和編輯條目詳細資訊。

# Step 5
