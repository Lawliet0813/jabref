# Walkthrough: Search
Search\ your\ library=搜索您的文獻庫
Prepare\ search\ settings=準備搜索設置

# Step 2
Welcome\ to\ the\ search\ walkthrough=歡迎使用搜索引導教程
This\ walkthrough\ will\ guide\ you\ through\ JabRef's\ search\ capabilities.\ We've\ loaded\ a\ sample\ library\ to\ demonstrate\ various\ search\ techniques.=本引導教程將帶您瞭解 JabRef 的搜索功能。我們已加載一個示例文獻庫來演示各種搜索技巧。

# Step 3
Click\ in\ the\ search\ field\ to\ begin=點擊搜索框開始

# Step 4
Type\ `machine\ learning`=輸入 `machine learning`
As\ you\ type,\ JabRef\ instantly\ dims\ all\ non-matching\ entries.\ By\ default,\ searches\ are\ case-insensitive\ and\ look\ through\ all\ fields\ like\ title,\ author,\ abstract,\ and\ keywords.=當您輸入時，JabRef 會立即調暗所有不匹配的條目。預設情況下，搜索不區分大小寫，並會查找所有欄位，如標題、作者、摘要和關鍵詞。

# Step 5
Understanding\ search\ results=理解搜索結果
Notice\ how\ entries\ not\ containing\ "machine\ learning"\ are\ dimmed.=請注意，不包含 "machine learning" 的條目是如何被調暗的。
This\ found\ entries\ with\ at\ least\ a\ field\ in\ their\ metadata\ (*e.g.,*\ title,\ author,\ abstract,\ *etc.*)\ containing\ "machine\ learning".=這找到了那些在其元資料（*例如*，標題、作者、摘要等）中至少有一個欄位包含 "machine learning" 的條目。

# Step 6
Toggle\ filter\ mode\ to\ hide\ non-matching\ entries=切換過濾模式以隱藏不匹配的條目
Filter\ mode\ shows\ only\ matching\ entries,\ hiding\ everything\ else.=過濾模式僅顯示匹配的條目，隱藏其他所有內容。

# Step 7
Clear\ the\ search\ to\ see\ all\ entries\ again=清除搜索以再次查看所有條目

# Step 8
Type\ `author\ \=\ Son`=輸入 `author \= Son`
The\ equals\ sign\ (`\=`)\ means\ "contains"\ and\ is\ case-insensitive\ by\ default.=等號（`\=`）表示“包含”，預設不區分大小寫。
This\ query\ finds\ all\ papers\ where\ any\ author's\ name\ contains\ "Son,"\ including\ "Maddison,"\ "Watson,\ J.,"\ or\ "Matson,\ Robert\ P.".\ It\ won't\ match\ "Son"\ appearing\ in\ titles\ or\ abstracts.=此查詢會找到所有作者姓名中包含 "Son" 的論文，包括 "Maddison"、"Watson, J." 或 "Matson, Robert P."。它不會匹配出現在標題或摘要中的 "Son"。

# Step 9
Type\ `date\ \=\=\ 2023`=輸入 `date \=\= 2023`
The\ double\ equals\ (`\=\=`)\ means\ exact\ match,\ not\ just\ contains.\ This\ query\ finds\ only\ papers\ with\ field\ "date"\ exactly\ in\ 2023.=雙等號（`\=\=`）表示精確匹配，而不僅僅是包含。此查詢僅查找 "date" 欄位恰好為 2023 年的論文。
With\ single\ equals\ (*e.g.,*\ `date\ \=\ 23`),\ you'd\ also\ match\ dates\ like\ 1923\ or\ 2230.=使用單等號（*例如*，`date \= 23`），您也會匹配到像 1923 或 2230 這樣的日期。

# Step 10
Type\ `shortauthor\ \=\ WHO\ AND\ date\ \=\=\ 2023`=輸入 `shortauthor \= WHO AND date \=\= 2023`
This\ query\ finds\ papers\ by\ WHO\ from\ 2023.\ `AND`\ requires\ both\ conditions\ to\ be\ true.=此查詢查找 WHO 在 2023 年的論文。`AND` 要求兩個條件都為真。

# Step 11
Type\ `title\ \=\ covid\ OR\ title\ \=\ pandemic`=輸入 `title \= covid OR title \= pandemic`
This\ query\ finds\ paper\ with\ title\ containing\ either\ COVID\ or\ pandemics\ in\ general.=此查詢查找標題包含 COVID 或一般性大流行病的論文。
`OR`\ can\ be\ satisified\ with\ either\ of\ the\ conditions\ being\ true.=`OR` 只需滿足其中一個條件即可。

# Step 12
Type\ `deep\ learning\ NOT\ title\ \=\ survey`=輸入 `deep learning NOT title \= survey`
This\ query\ finds\ entries\ with\ "deep\ learning"\ in\ its\ metadata,\ but\ not\ "survey"\ in\ the\ title.=此查詢查找其元資料中包含 "deep learning"，但標題中不包含 "survey" 的條目。
NOT\ helps\ you\ filter\ out\ unwanted\ results.=NOT 運算符可幫助您過濾掉不需要的結果。

# Step 13
Enable\ regular\ expressions\ for\ pattern\ matching=啟用正則表達式進行模式匹配
Regular\ expressions\ allow\ sophisticated\ pattern\ matching.\ Click\ this\ button\ to\ enable\ regex\ mode\ for\ advanced\ searches.=正則表達式允許進行復雜的模式匹配。點擊此按鈕可啟用正則表達式模式以進行高級搜索。

# Step 14
The\ `\=~`\ operator\ explicitly\ uses\ regex.\ The\ pipe\ operator\ `|`\ allows\ `(deep|machine)`\ matches\ either\ word\ (deep\ or\ machine).\ This\ finds\ "deep\ learning"\ and\ "machine\ learning"\ but\ not\ "learning"\ alone.=`\=~` 運算符顯式使用正則表達式。管道運算符 `|` 允許 `(deep|machine)` 匹配任意一個詞（deep 或 machine）。這樣可以找到 "deep learning" 和 "machine learning"，但不會單獨匹配 "learning"。
Type\ `title\ \=~\ \\(deep|machine\\)\ learning`=輸入 `title \=~ \\(deep|machine\\) learning`
Click\ on\ the\ regex\ button\ on\ previous\ step\ enables\ regex\ mode,\ allowing\ you\ to\ type\ `\\(deep|machine\\)\ learning`\ directly\ to\ search\ for\ any\ entry\ with\ metadata\ matching\ the\ regex.\ If\ you\ use\ `\=~`,\ regardless\ of\ whether\ regex\ mode\ is\ enabled,\ it\ will\ always\ treat\ the\ search\ as\ a\ regex.=點擊上一步的正則表達式按鈕可啟用正則表達式模式，允許您直接輸入 `\\(deep|machine\\) learning` 來搜索任何元資料匹配該正則表達式的條目。如果您使用 `\=~`，無論是否啟用了正則表達式模式，它都將始終將搜索視為正則表達式。

# Step 15
Enable\ case-sensitive\ searching=啟用區分大小寫搜索
This\ is\ useful\ when\ case\ matters,\ like\ distinguishing\ "WHO"\ (World\ Health\ Organization)\ from\ "who".=這在大小寫重要時很有用，例如區分 \"WHO\"（世界衛生組織）和 \"who\"。

# Step 16
Type\ `WHO`=輸入 `WHO`
This\ query\ finds\ entries\ with\ capital\ WHO\ only.\ With\ case\ sensitivity\ on,\ this\ won't\ match\ "who"\ or\ "Who".=此查詢僅查找包含大寫 WHO 的條目。啟用區分大小寫後，不會匹配 \"who\" 或 \"Who\"。

