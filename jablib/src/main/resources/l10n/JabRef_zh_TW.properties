Click\ the\ "Add"\ button\ (first\ button\ with\ a\ plus\ icon)\ to\ link\ a\ PDF\ file\ that\ you\ already\ have\ on\ your\ computer.\ This\ will\ open\ a\ dialog\ where\ you\ can\ browse\ and\ select\ the\ file.=點擊"新增"按鈕（第一個帶加號圖標的按鈕）以鏈接您電腦上已有的 PDF 文件。這將開啟一個對話框，您可以在其中瀏覽並選擇文件。

# Step 8
Browse\ for\ your\ PDF\ file=瀏覽您的 PDF 文件
Use\ the\ "Browse"\ button\ to\ select\ a\ PDF\ file\ from\ your\ computer.\ Click\ the\ folder\ icon\ next\ to\ the\ "Link"\ field\ to\ open\ the\ file\ browser.=使用"瀏覽"按鈕從您的電腦中選擇一個 PDF 文件。點擊"鏈接"欄位旁邊的資料夾圖標以開啟文件瀏覽器。

# Step 9
