Enter\ a\ meaningful\ description\ for\ this\ file\ in\ the\ "Description"\ field.\ This\ helps\ you\ identify\ the\ file\ later.=在“描述”欄位中為此文件輸入有意義的描述。這有助於您日後識別該文件。

# Step 10
Select\ the\ file\ type=選擇文件類型
Choose\ the\ appropriate\ file\ type\ from\ the\ "Filetype"\ dropdown.\ Usually\ "PDF"\ is\ the\ correct\ choice\ for\ research\ papers.=從“文件類型”下拉菜單中選擇合適的文件類型。對於研究論文，通常“PDF”是正確的選擇。

# Step 11
Optionally\ add\ source\ URL=可選新增來源URL
If\ you\ downloaded\ this\ file\ from\ a\ website,\ you\ can\ add\ the\ source\ URL\ in\ the\ "Source\ URL"\ field.\ This\ is\ optional\ but\ helpful\ for\ tracking\ where\ you\ found\ the\ file.=如果您是從網站下載的此文件，可以在“來源URL”欄位中新增該URL。此步驟是可選的，但有助於追蹤您找到該文件的位置。

# Step 12
