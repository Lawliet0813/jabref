This\ is\ the\ PDF\ file\ management\ area\ where\ you\ can\ link\ files\ to\ your\ bibliography\ entries.\ Notice\ the\ three\ buttons\ on\ the\ right\ side—each\ offers\ a\ different\ way\ to\ add\ PDF\ files.\ Let's\ explore\ each\ method\ step\ by\ step.=這是 PDF 文件管理區域，您可以在此將文件鏈接到您的書目條目。請注意右側的三個按鈕——每個都提供了一種新增 PDF 文件的不同方式。讓我們逐步探索每種方法。

# Step 6
Drag\ and\ drop\ files=拖放文件
You\ can\ drag\ and\ drop\ PDF\ files\ directly\ onto\ the\ file\ list\ area.\ This\ is\ often\ the\ quickest\ way\ to\ link\ files\ that\ are\ already\ on\ your\ computer.=您可以直接將 PDF 文件拖放到文件列表區域。這通常是鏈接您電腦上已有文件的最快方式。
