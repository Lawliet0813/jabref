Now\ click\ "Add"\ to\ complete\ the\ file\ linking\ process,\ or\ "Cancel"\ to\ try\ another\ method.=現在點擊“新增”以完成文件鏈接過程，或點擊“取消”嘗試其他方法。

# Step 13
