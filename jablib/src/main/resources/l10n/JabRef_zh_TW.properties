The\ columns\ you\ configure\ here\ will\ be\ displayed\ whenever\ you\ open\ a\ library\ in\ JabRef.\ You\ can\ always\ return\ to\ this\ settings\ page\ to\ modify\ your\ column\ preferences.=您在此處配置的列將在您每次於 JabRef 中開啟文獻庫時顯示。您可以隨時返回此設置頁面修改您的列首選項。
