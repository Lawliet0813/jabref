This\ walkthrough\ will\ guide\ you\ through\ how\ to\ link\ your\ PDF\ files\ with\ JabRef.\ We've\ opened\ an\ example\ library\ so\ you\ can\ see\ how\ this\ feature\ works\ with\ actual\ bibliography\ entries.=本引導教程將指導您如何將 PDF 文件與 JabRef 鏈接。我們已開啟一個示例庫，以便您瞭解此功能如何與實際的書目條目配合使用。

